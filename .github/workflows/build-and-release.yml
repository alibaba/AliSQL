name: build-and-release
run-name: AliSQL ${{ inputs.tag || github.event.release.tag_name || github.ref_name }} (${{ github.event_name == 'workflow_dispatch' && !inputs.publish && 'validation' || 'publish' }})

on:
  push:
    tags:
      - 'AliSQL-8.0.*'
      - 'AliSQL-5.7.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag for package names; publishing requires this tag to exist'
        required: true
        type: string
      publish:
        description: 'Publish release assets (false builds the selected branch without publishing)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && !inputs.publish && github.ref || 'publish' }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: songhuaxiong/alisql
  DOCKER_REPOSITORY: p1p1bear/alisql-docker

jobs:
  parse:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'AliSQL-8.0.') || startsWith(github.event.release.tag_name, 'AliSQL-5.7.')
    runs-on: ubuntu-latest
    outputs:
      tag:     ${{ steps.p.outputs.tag }}
      version: ${{ steps.p.outputs.version }}
      major:   ${{ steps.p.outputs.major }}
      minor:   ${{ steps.p.outputs.minor }}
      patch:   ${{ steps.p.outputs.patch }}
      extra:   ${{ steps.p.outputs.extra }}
      publish: ${{ steps.p.outputs.publish }}
      source_ref: ${{ steps.p.outputs.source_ref }}
    steps:
      - id: p
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$REQUESTED_TAG"
            PUBLISH="${REQUESTED_PUBLISH:-false}"
          elif [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="$RELEASE_TAG"
            PUBLISH=true
          else
            TAG="$GITHUB_REF_NAME"
            PUBLISH=true
          fi

          case "$PUBLISH" in
            true|false) ;;
            *) echo 'publish must be true or false' >&2; exit 1 ;;
          esac

          if [[ "$TAG" =~ ^AliSQL-([0-9]+)\.([0-9]+)\.([0-9]+)-([0-9A-Za-z][0-9A-Za-z._-]*)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            EXTRA="${BASH_REMATCH[4]}"
          else
            echo "Invalid tag: ${TAG}" >&2
            exit 1
          fi

          case "${MAJOR}.${MINOR}" in
            8.0|5.7) ;;
            *)
              echo "Unsupported AliSQL series: ${MAJOR}.${MINOR}" >&2
              exit 1
              ;;
          esac

          VERSION="${TAG#AliSQL-}"
          if [[ "$PUBLISH" == true ]]; then
            SOURCE_REF="refs/tags/${TAG}"
          else
            SOURCE_REF="$GITHUB_SHA"
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "major=$MAJOR"
            echo "minor=$MINOR"
            echo "patch=$PATCH"
            echo "extra=$EXTRA"
            echo "publish=$PUBLISH"
            echo "source_ref=$SOURCE_REF"
          } >> "$GITHUB_OUTPUT"
          echo "Parsed: version=$VERSION major=$MAJOR minor=$MINOR patch=$PATCH extra=$EXTRA"
          echo "Source: $SOURCE_REF; publish: $PUBLISH"

  notes:
    needs: parse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Checkout source changelogs
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.source_ref }}
          path: release-source
          sparse-checkout: wiki
          persist-credentials: false

      - name: Validate and render release notes
        env:
          TAG: ${{ needs.parse.outputs.tag }}
          LINK_REF: ${{ needs.parse.outputs.publish == 'true' && needs.parse.outputs.tag || needs.parse.outputs.source_ref }}
        run: |
          set -euo pipefail
          python3 workflow-tools/.github/scripts/test_release_notes.py
          python3 workflow-tools/.github/scripts/release-notes.py \
            --source-root release-source \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" --link-ref "$LINK_REF" \
            --docker-image "$DOCKER_IMAGE" --docker-repository "$DOCKER_REPOSITORY" \
            --output release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [parse, notes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            cmake_arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            cmake_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout package validation helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-ci
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Build inside oraclelinux:7
        env:
          MAJOR:      ${{ needs.parse.outputs.major }}
          MINOR:      ${{ needs.parse.outputs.minor }}
          PATCH:      ${{ needs.parse.outputs.patch }}
          EXTRA:      ${{ needs.parse.outputs.extra }}
          CMAKE_ARCH: ${{ matrix.cmake_arch }}
        run: |
          set -euxo pipefail
          git log -1 --format='Building source %H'
          mkdir -p "${GITHUB_WORKSPACE}/out"
          docker run --rm -i \
            -v "${GITHUB_WORKSPACE}:/AliSQL" \
            -v "${GITHUB_WORKSPACE}/out:/out" \
            -e MAJOR -e MINOR -e PATCH -e EXTRA -e CMAKE_ARCH \
            oraclelinux:7 \
            bash -exo pipefail <<'INNER'

          # ---- Toolchain repo (devtoolset-10) ----
          cat >/etc/yum.repos.d/ol7-scl.repo <<'REPO'
          [ol7_software_collections]
          name=Oracle Linux 7 Software Collections ($basearch)
          baseurl=https://yum.oracle.com/repo/OracleLinux/OL7/SoftwareCollections/$basearch/
          gpgcheck=1
          enabled=1
          gpgkey=https://yum.oracle.com/RPM-GPG-KEY-oracle-ol7
          REPO

          yum clean all
          yum makecache
          yum install -y git wget python3 \
            devtoolset-10-gcc devtoolset-10-gcc-c++ devtoolset-10-binutils \
            openssl openssl-devel ncurses-devel libaio-devel perl-IPC-Cmd bison

          # ---- CMake ----
          cd /opt
          wget -q "https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-${CMAKE_ARCH}.tar.gz"
          tar -xzf "cmake-3.28.6-linux-${CMAKE_ARCH}.tar.gz"
          export PATH="/opt/cmake-3.28.6-linux-${CMAKE_ARCH}/bin:$PATH"
          cmake --version

          # ---- Inject version from tag ----
          # 8.0 branch uses MYSQL_VERSION; 5.7 branch uses VERSION; same internal format.
          cd /AliSQL
          MAX_JOBS="$(nproc 2>/dev/null || true)"
          if [ -z "$MAX_JOBS" ]; then
            MAX_JOBS="$(grep -c '^processor[[:space:]]*:' /proc/cpuinfo 2>/dev/null || true)"
          fi
          if ! [[ "$MAX_JOBS" =~ ^[1-9][0-9]*$ ]]; then
            MAX_JOBS=2
          fi
          if [ "$MAX_JOBS" -gt 32 ]; then
            MAX_JOBS=32
          fi
          export MAX_JOBS
          echo "DuckDB build jobs: ${MAX_JOBS}"

          VERSION_FILE=""
          for f in MYSQL_VERSION VERSION; do
            [ -f "$f" ] && VERSION_FILE="$f" && break
          done
          if [ -z "$VERSION_FILE" ]; then
            echo "ERROR: neither MYSQL_VERSION nor VERSION found in source root" >&2
            exit 1
          fi
          sed -i \
            -e "s/^MYSQL_VERSION_MAJOR=.*/MYSQL_VERSION_MAJOR=${MAJOR}/" \
            -e "s/^MYSQL_VERSION_MINOR=.*/MYSQL_VERSION_MINOR=${MINOR}/" \
            -e "s/^MYSQL_VERSION_PATCH=.*/MYSQL_VERSION_PATCH=${PATCH}/" \
            -e "s/^MYSQL_VERSION_EXTRA=.*/MYSQL_VERSION_EXTRA=-${EXTRA}/" \
            "$VERSION_FILE"
          echo "--- ${VERSION_FILE} after injection ---"
          cat "$VERSION_FILE"

          # Older tags hard-code 32 parallel DuckDB compiler jobs. Limit the
          # checked-out build tree so release retries fit hosted runners.
          if [ -f extra/duckdb/Makefile ] && \
             grep -Eq '^[[:space:]]*cmake --build \. --config Release -j ' \
               extra/duckdb/Makefile; then
            sed -i -E \
              "s#(^[[:space:]]*cmake --build \\. --config Release -j) .+#\\1 ${MAX_JOBS}#" \
              extra/duckdb/Makefile
            if ! grep -Eq \
              "^[[:space:]]*cmake --build \\. --config Release -j ${MAX_JOBS}[[:space:]]*$" \
              extra/duckdb/Makefile; then
              echo "ERROR: failed to limit DuckDB release build parallelism" >&2
              exit 1
            fi
          fi

          # ---- Build & install ----
          source /opt/rh/devtoolset-10/enable
          sh build.sh -t release -d /opt/alisql
          make install

          # ---- Package ----
          cd /opt
          VER="${MAJOR}.${MINOR}.${PATCH}-${EXTRA}"
          GLIBC="glibc$(ldd --version | awk 'NR==1{print $NF}')"
          ARCH="$(uname -m)"
          PKG="alisql-${VER}-linux-${GLIBC}-${ARCH}.tar.xz"
          TOPDIR="${PKG%.tar.xz}"
          XZ_OPT='-T0 -9' tar -cJf "/out/${PKG}" \
            --transform="s,^alisql,${TOPDIR}," \
            --exclude='alisql/mysql-test' \
            --exclude='alisql/run' \
            --exclude='alisql/var' \
            --exclude='alisql/LICENSE-test' \
            --exclude='alisql/LICENSE.router' \
            --exclude='alisql/README-test' \
            --exclude='alisql/README.router' \
            --exclude='alisql/mysqlrouter-log-rotate' \
            alisql/
          ls -lh "/out/${PKG}"

          # Validate the relocated archive, including its shared-library paths.
          SMOKE_ROOT="$(mktemp -d /tmp/alisql-package.XXXXXX)"
          tar -xJf "/out/${PKG}" -C "$SMOKE_ROOT"
          bash /AliSQL/.release-ci/.github/scripts/smoke-release.sh \
            "${SMOKE_ROOT}/${TOPDIR}" "$VER" /AliSQL \
            2>&1 | tee "/out/smoke-${ARCH}.log"
          INNER

      - name: Upload package smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.arch }}
          path: ${{ github.workspace }}/out/smoke-*.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: alisql-${{ matrix.arch }}
          path: ${{ github.workspace }}/out/alisql-*.tar.xz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [parse, notes, build]
    if: needs.parse.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: alisql-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create or update release with tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ needs.parse.outputs.tag }}
          VERSION:  ${{ needs.parse.outputs.version }}
        run: |
          set -euo pipefail

          X86_PACKAGE="alisql-${VERSION}-linux-glibc2.17-x86_64.tar.xz"
          ARM_PACKAGE="alisql-${VERSION}-linux-glibc2.17-aarch64.tar.xz"
          NOTES_FILE="notes/release-notes.md"

          test -f "artifacts/${X86_PACKAGE}"
          test -f "artifacts/${ARM_PACKAGE}"
          test -s "$NOTES_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "artifacts/${X86_PACKAGE}" \
              "artifacts/${ARM_PACKAGE}"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              "artifacts/${X86_PACKAGE}" \
              "artifacts/${ARM_PACKAGE}"
          fi

  # The Docker build downloads these release assets, so it must run afterwards.
  trigger-docker:
    needs: [parse, release]
    if: needs.parse.outputs.publish == 'true' && github.repository == 'alibaba/AliSQL'
    runs-on: ubuntu-latest
    steps:
      - name: Push release tag to the Docker repository
        env:
          PAT: ${{ secrets.DOCKER_REPO_PAT }}
          TAG: ${{ needs.parse.outputs.tag }}
        run: |
          set -euo pipefail

          if [[ -z "$PAT" ]]; then
            echo "DOCKER_REPO_PAT is not configured." >&2
            exit 1
          fi

          REPOSITORY_URL="https://x-access-token:${PAT}@github.com/${DOCKER_REPOSITORY}.git"
          git clone --depth 1 "$REPOSITORY_URL" docker-repository
          cd docker-repository

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists in ${DOCKER_REPOSITORY}; skipping."
            exit 0
          fi

          git tag "$TAG"
          git push origin "refs/tags/${TAG}"

          {
            echo "Docker build triggered for ${DOCKER_IMAGE}:${TAG#AliSQL-}."
            echo "https://github.com/${DOCKER_REPOSITORY}/actions/workflows/build.yml"
          } >> "$GITHUB_STEP_SUMMARY"
